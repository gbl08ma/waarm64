# Shared, imported memory so JIT-generated modules and other vCPU workers can use it.
# Layout A (M0.5): this one memory holds core state and guest RAM (see bench/spike/memory/REPORT.md).
[target.wasm32-unknown-unknown]
# No simd128: the core never uses SIMD itself, and with it the pinned nightly
# miscompiled the JIT's register-mask code three times (docs/backlog.md).
rustflags = [
  "-C", "target-feature=+bulk-memory,+mutable-globals",
  "-Z", "llvm-target-feature=+atomics",
  "-C", "link-arg=--import-memory",
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=4294967296",
  "-C", "link-arg=--export-table",
  "-C", "link-arg=--growable-table",
]
