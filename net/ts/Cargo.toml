[package]
name = "waarm64_ts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "waarm64's tailnet client: tailcat and Tailscale, sans I/O, for a browser worker (docs/networking/tailnet.md)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The tests' pretend Bitcoin (room/names: easy headers, cheap proof of work) compiled in as the parameters the module runs
# on, for the page tests' build (`net/ts/build.sh --test-params`: target/net/ts-test.wasm) and the title tool
# (examples/names-title.rs). Never the shipped module's: without it, the module has no other parameters than production's.
test-params = []

[dependencies]
# tailscale-rs's sans-I/O protocol crates (BSD-3-Clause): WireGuard, keys, packets.
ts_tunnel = "0.6.1"
ts_keys = "0.6.1"
ts_packet = "0.6.1"
crypto_box = "0.9"
blake2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
# T4: the control session (docs/networking/tailnet.md "Tailscale"): the Noise handshake, the control
# protocol's wire types, HTTP/2 inside the Noise channel (driven without a runtime, h2pipe.rs).
ts_noise = "0.6.1"
ts_capabilityversion = "0.6.1"
ts_control_serde = "0.6.1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "3.0.0", default-features = false }
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", default-features = false }
ipnet = "2"
ed25519-dalek = { version = "3.0.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# T5: the tailnet data plane: the packet filter, disco pongs.
ts_packetfilter = "0.6.1"
ts_packetfilter_state = "0.6.1"
ts_disco_protocol = "0.6.1"
# Rooms (docs/networking/rooms.md): BIP-340 signatures on secp256k1 for Nostr events, and their SHA-256 ids.
k256 = { version = "0.13", default-features = false, features = ["schnorr", "alloc"] }
sha2 = { version = "0.10", default-features = false }
# Room names (docs/plans/room-names.md "Records"): an entry's proof of work, Argon2id (OK'd 2026-11-15 for N0's pick).
argon2 = { version = "0.5", default-features = false }

# The room key miner (examples/room-key-mine.rs, docs/networking/rooms.md): native only, never in the wasm module.
[dev-dependencies]
curve25519-dalek = "5"
regex = "1"

[[example]]
name = "room-key-mine"
test = true

# Titles for the page tests (tests/page-room.test.ts), on the tests' pretend Bitcoin, until the names agent makes them.
[[example]]
name = "names-title"
required-features = ["test-params"]

# Where a server's memory goes (bench/net/REPORT.md "NAMES loop 6b"): a counting allocator over a registry and a sync.
[[example]]
name = "names-memory"
required-features = ["test-params"]
