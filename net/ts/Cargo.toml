[package]
name = "webpc_ts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "webpc's tailnet client: tailcat and Tailscale, sans I/O, for a browser worker (docs/plans/tailnet-client.md)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# tailscale-rs's sans-I/O protocol crates (BSD-3-Clause): WireGuard, keys, packets.
ts_tunnel = "0.6.1"
ts_keys = "0.6.1"
ts_packet = "0.6.1"
crypto_box = "0.9"
blake2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
# T4: the control session (docs/plans/tailnet-client.md §5): the Noise handshake, the control
# protocol's wire types, HTTP/2 inside the Noise channel (driven without a runtime, h2pipe.rs).
ts_noise = "0.6.1"
ts_capabilityversion = "0.6.1"
ts_control_serde = "0.6.1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "3.0.0", default-features = false }
h2 = "0.4"
http = "1"
bytes = "1"
tokio = { version = "1", default-features = false }
ipnet = "2"
ed25519-dalek = { version = "3.0.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# T5: the tailnet data plane: the packet filter, disco pongs.
ts_packetfilter = "0.6.1"
ts_packetfilter_state = "0.6.1"
ts_disco_protocol = "0.6.1"
