[package]
name = "waarm64-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The diagnostic build's tallies (core/src/tally.rs): `scripts/build-wasm.sh --features diag`, never the normal build.
diag = []
# The differential tests' polled core (scripts/ci-jit.sh): user-mode JIT vCPUs (`jit_new`) compile parallel SMP's polled
# code, and `jit_run` stores the steps left in the stop word and returns the steps it ran (docs/testing.md "Polled code
# against the interpreter"). A test build in its own target directory, never the normal build: no export changes.
polled = []

[dependencies]
# The snapshot file's codec 2 (the LZ4 block format) and its frames' CRC-32 (docs/platform.md "The snapshot file").
lz4_flex = { version = "0.14.2", default-features = false, features = ["safe-encode", "safe-decode"] }
crc32fast = { version = "1.5", default-features = false }
# qcow2's compressed clusters: raw deflate, inflated for reads and deflated for exports (docs/devices.md "qcow2"). Its
# deflate needs `with-alloc` (the compressor's tables are boxed); its inflate doesn't allocate.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
