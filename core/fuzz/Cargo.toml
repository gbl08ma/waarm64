# Decoder/interpreter fuzzing against Capstone (docs/testing.md). Development
# only: a separate workspace, so capstone never reaches the core's builds.
#   cargo fuzz run decode            (from core/)
#   cargo fuzz run virtqueue         (from core/; the virtio transport and split queues)
#   cargo run --release --bin sweep  (from core/fuzz/)
[package]
name = "webpc-core-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
capstone = "0.14.0"
webpc-core = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "virtqueue"
path = "fuzz_targets/virtqueue.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sweep"
path = "src/sweep.rs"
test = false
doc = false
bench = false

[workspace]
