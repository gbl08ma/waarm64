<!doctype html>
<meta charset="utf-8">
<title>WebUSB rig</title>
<script type="module">
  // tests/usb-webusb.test.ts drives this: the checks run in a dedicated worker (usb-worker.js).
  window.inWorker = (msg) => new Promise((resolve, reject) => {
    const w = new Worker('usb-worker.js');
    w.onmessage = (e) => { w.terminate(); e.data.type === 'error' ? reject(new Error(e.data.message)) : resolve(e.data); };
    w.onerror = (e) => { w.terminate(); reject(new Error(e.message)); };
    w.postMessage(msg);
  });
</script>
