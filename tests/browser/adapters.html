<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<script type="module">
  // tests/net-tailnet.test.ts's two adapters (docs/network-adapters.md §4, L2): the page's Debian (its card's
  // credential, as web/app/machine.ts gives it) with two cards, each a Network (web/app/network.ts) as the page's
  // machine has them: adapter 1 on a tailnet (`control`, `authkey`, `hostname`) with no exit node, adapter 2 on tailcat
  // through a server (`tailcat`). As web/app/net-live.ts does, every change picks the primary again (primaryOf) and
  // tells each adapter whether it is. The test drives the guest's serial console through window.harness.
  import { createNetwork, primaryOf } from '../../web/app/network.ts';
  const q = new URLSearchParams(location.search);
  let primary = -1;
  const nets = [];
  const changed = () => {
    primary = primaryOf(nets.map((n) => n.view()));
    nets.forEach((n, k) => n.setPrimary(primary < 0 || k === primary));
  };
  nets.push(createNetwork(changed), createNetwork(changed));
  const ports = nets.map((n) => n.port());
  const worker = new Worker(new URL('./tailnet-worker.ts', import.meta.url), { type: 'module' });
  const serial = new MessageChannel();
  let output = '';
  let error;
  worker.onmessage = (e) => { if (e.data.serial) output += e.data.serial; else if (e.data.error) error = e.data.error; };
  worker.onerror = (e) => { error = e.message; };
  worker.postMessage({ page: true, serial: serial.port2, overlay: q.get('overlay'), ports }, [serial.port2, ...ports]);
  nets[0].connect({ controlURL: q.get('control'), authKey: q.get('authkey') ?? undefined, hostname: q.get('hostname') ?? 'guest' });
  nets[1].connect({ controlURL: '', hostname: '', tailcat: q.get('tailcat') });
  window.harness = {
    send: (s) => serial.port1.postMessage(s),
    output: () => output,
    error: () => error,
    views: () => nets.map((n) => n.view()),
    primary: () => primary,
  };
</script>
