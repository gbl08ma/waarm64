<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<script type="module">
  // A Tailscale backend in Chromium with no guest (tests/tailscale-browser.test.ts): starts
  // web/tailscale.ts against `?control=` (an auth key, `?persist=` to keep the
  // node) and plays the guest on the gateway's side of its IP port: UDP echoes to `?peer=`'s `?port=`
  // (the peer's userspace tailscaled hands its ports to its machine's localhost, where the test's
  // echo server is), counting what comes back.
  import { startTailscale } from '../../web/tailscale.ts';
  import { IP_HEADROOM, packetsOf } from '../../web/net.ts';
  import * as pk from '../net/packets.ts';
  const q = new URLSearchParams(location.search);
  const events = [];
  const ts = startTailscale({ controlURL: q.get('control'), authKey: q.get('authkey') || undefined, hostname: q.get('hostname') ?? 'browser', persist: q.get('persist') || undefined }, (m) => events.push(m));
  const port = Number(q.get('port'));
  const peer = q.get('peer');
  let lease = null;
  const waiting = new Map();
  ts.ip.onmessage = (e) => {
    const packets = packetsOf(e.data, IP_HEADROOM);
    if (!packets) { if (e.data?.type === 'lease') lease = e.data.lease; return; }
    for (const p of packets) if (p[0] >> 4 === 4 && p[9] === 17 && p.length >= 32) waiting.get(new DataView(p.buffer, p.byteOffset).getUint32(28))?.(p);
  };
  let seq = 0;
  async function echoes(n, size, window = 16) {
    let back = 0;
    const t = performance.now();
    const self = lease.address.join('.');
    const one = () => new Promise((resolve) => {
      const s = ++seq;
      const to = setTimeout(() => { waiting.delete(s); resolve(); }, 3000);
      waiting.set(s, () => { clearTimeout(to); waiting.delete(s); back++; resolve(); });
      const payload = new Uint8Array(size);
      new DataView(payload.buffer).setUint32(0, s);
      const b = pk.udp(self, 20000, peer, port, payload).buffer;
      ts.ip.postMessage(b, [b]);
    });
    let sent = 0;
    await Promise.all(Array.from({ length: window }, async () => { while (sent < n) { sent++; await one(); } }));
    return { back, ms: performance.now() - t };
  }
  window.harness = {
    tailscale: () => ({ state: ts.state(), netmap: ts.netmap(), timings: ts.timings(), lease }),
    events: () => events,
    echoes,
    logout: () => ts.logout().then(() => 'done'),
    close: () => ts.close(),
    logOutNode: async (c) => (await import('../../web/app/network.ts')).logOutNode(c),
    stored: () => new Promise((resolve) => {
      const r = indexedDB.open('waarm64-tailscale', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('state');
      r.onsuccess = () => { const g = r.result.transaction('state').objectStore('state').getAllKeys(); g.onsuccess = () => resolve(g.result); };
    }),
  };
</script>
