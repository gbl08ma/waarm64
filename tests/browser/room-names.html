<meta charset="utf-8">
<link rel="icon" href="data:,">
<script type="module">
  // A room's registry records in IndexedDB (web/room.ts `roomNamesStore`, web/room-worker.ts; tests/room-names.test.ts):
  // `waarm64-room` at version 1 (an identity kept before the names store) is opened at version 2 with the identity kept;
  // records are written in batches, read back by room, deleted; a room's worker streams its stored records into the
  // module before the first tick and deletes those the module doesn't take.
  import { forgetRoomRecords, NAMES_WRITE_MS, readRoomIdentity, roomNamesKey, roomNamesStore, startRoom } from '../../web/room.ts';
  const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  window.harness = {
    /** An old page's database: version 1, one identity. */
    async old() {
      await new Promise((resolve, reject) => {
        const open = indexedDB.open('waarm64-room', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('identity');
        open.onsuccess = () => {
          const tx = open.result.transaction('identity', 'readwrite');
          tx.objectStore('identity').put({ key: 'ab'.repeat(32) }, 'old');
          tx.oncomplete = () => { open.result.close(); resolve(); };
        };
        open.onerror = () => reject(open.error);
      });
    },
    async store() {
      const identity = await readRoomIdentity('old');
      const a = await roomNamesStore('room a', 'conn 1');
      const b = await roomNamesStore('room b', 'conn 1');
      // Another stored connection in room a (two machines on one page): its records apart.
      const a2 = await roomNamesStore('room a', 'conn 2');
      a2.write(new Uint8Array(32).fill(1), new Uint8Array([2, 42]));
      await a2.flush();
      const id = (k) => new Uint8Array(32).fill(k);
      a.write(id(1), new Uint8Array([2, 1]));
      a.write(id(2), new Uint8Array([2, 2]));
      a.write(id(3), new Uint8Array([2, 3]));
      a.write(id(2), new Uint8Array([2, 22])); // the last of an id's wins
      b.write(id(1), new Uint8Array([2, 9]));
      const before = (await a.load()).length; // not written yet: batched
      await sleep(NAMES_WRITE_MS + 300);
      const first = (await a.load()).map((r) => [r.id, Array.from(r.record)]);
      a.write(hex(id(3)), null);
      await a.flush();
      const second = (await a.load()).map((r) => [r.id, Array.from(r.record)]);
      const other = (await b.load()).map((r) => [r.id, Array.from(r.record)]);
      const otherConn = (await a2.load()).map((r) => [r.id, Array.from(r.record)]);
      // Its connection deleted: its records in room a go, the same connection's in room b and another's in room a stay.
      await forgetRoomRecords('room a', 'conn 1');
      const swept = [(await a.load()).length, (await b.load()).length, (await a2.load()).length];
      return {
        identity, before, first, second, other, otherConn, swept,
        key: await roomNamesKey('room a', 'conn 1'), keyB: await roomNamesKey('room b', 'conn 1'), keyConn: await roomNamesKey('room a', 'conn 2'),
      };
    },
    /** A stored connection's room started with a record stored that the module refuses (another version's): deleted. */
    async worker(wasm) {
      const id = 'room c';
      const s = await roomNamesStore(id, 'names-test');
      s.write(new Uint8Array(32).fill(7), new Uint8Array([9, 9, 9]));
      await s.flush();
      const stored = (await s.load()).length;
      const events = [];
      const room = startRoom({ room: { link: `waarm64-room:${encodeURIComponent(id)}?nostr=${encodeURIComponent('ws://127.0.0.1:9')}&derp=127.0.0.1%3A9` }, identityKey: 'names-test', wasm }, (e) => events.push(e));
      for (let k = 0; k < 100 && !events.some((e) => e.type === 'self'); k++) await sleep(50);
      await sleep(NAMES_WRITE_MS + 500);
      const left = (await s.load()).length;
      room.close();
      return { stored, left, self: events.find((e) => e.type === 'self') };
    },
    /** An ephemeral connection's room (its key in memory, its id as `identityKey`): its worker neither reads nor writes
     * the store, so the record the module would refuse stays. */
    async ephemeral(wasm) {
      const id = 'room e';
      const s = await roomNamesStore(id, 'eph-test');
      s.write(new Uint8Array(32).fill(7), new Uint8Array([9, 9, 9]));
      await s.flush();
      const events = [];
      const room = startRoom({ room: { link: `waarm64-room:${encodeURIComponent(id)}?nostr=${encodeURIComponent('ws://127.0.0.1:9')}&derp=127.0.0.1%3A9` }, identityKey: 'eph-test', identity: { key: 'cd'.repeat(32) }, wasm }, (e) => events.push(e));
      for (let k = 0; k < 100 && !events.some((e) => e.type === 'self'); k++) await sleep(50);
      await sleep(NAMES_WRITE_MS + 500);
      room.close();
      return { left: (await s.load()).length, self: !!events.find((e) => e.type === 'self') };
    },
    /** The same, closed as soon as it runs: the delete waiting for its batch is written before the worker goes. */
    async closed(wasm) {
      const id = 'room d';
      const s = await roomNamesStore(id, 'names-test');
      s.write(new Uint8Array(32).fill(7), new Uint8Array([9, 9, 9]));
      await s.flush();
      const events = [];
      const room = startRoom({ room: { link: `waarm64-room:${encodeURIComponent(id)}?nostr=${encodeURIComponent('ws://127.0.0.1:9')}&derp=127.0.0.1%3A9` }, identityKey: 'names-test', wasm }, (e) => events.push(e));
      for (let k = 0; k < 100 && !events.some((e) => e.type === 'self'); k++) await sleep(50);
      room.close();
      await sleep(NAMES_WRITE_MS + 1000);
      return { left: (await s.load()).length };
    },
  };
</script>
