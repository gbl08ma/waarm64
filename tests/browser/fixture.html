<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<script type="module">
  // Makes a booted-Debian fixture (tests/debian-fixture.ts): the harness's machine (tailnet-worker.ts) in the shape
  // `shape` (JSON: `page`, `ip`, `ports`, `adapters`, `disk`) with nothing on the far end of its IP ports, so no lease
  // comes; its disk on an overlay, as every restore's is (a disk without one is read-only: another machine); the test saves it at the login prompt through window.harness.save().
  import { fixtureHooks } from './fixture-hooks.ts';
  const shape = JSON.parse(new URLSearchParams(location.search).get('shape'));
  const worker = new Worker(new URL('./tailnet-worker.ts', import.meta.url), { type: 'module' });
  const serial = new MessageChannel();
  let output = '';
  let error;
  worker.onmessage = (e) => { if (e.data.serial) output += e.data.serial; else if (e.data.error) error = e.data.error; };
  worker.onerror = (e) => { error = e.message; };
  const ip = shape.ip ? new MessageChannel() : undefined;
  const ports = Array.from({ length: shape.ports ?? 0 }, () => new MessageChannel());
  worker.postMessage({ page: !!shape.page, serial: serial.port2, overlay: 'waarm64-fixture', ip: ip?.port2, adapters: shape.adapters, ports: ports.length ? ports.map((c) => c.port2) : undefined, disk: shape.disk && new URL(shape.disk, location.href).href }, [serial.port2, ...(ip ? [ip.port2] : []), ...ports.map((c) => c.port2)]);
  window.harness = { send: (s) => serial.port1.postMessage(s), output: () => output, error: () => error, ...fixtureHooks(worker) };
</script>
