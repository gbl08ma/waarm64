<!doctype html>
<meta charset="utf-8">
<title>Folders tree</title>
<script type="module">
  // tests/folders.test.ts: the tree's cases, in a worker (OPFS's sync access handles need one).
  const worker = new Worker(new URL('./folders-worker.ts', import.meta.url), { type: 'module' });
  window.__result = new Promise((resolve, reject) => {
    worker.onmessage = (e) => resolve(e.data);
    worker.onerror = (e) => reject(new Error(e.message));
  });
  worker.postMessage('run');
</script>
