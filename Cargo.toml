[workspace]
members = ["core", "bench/spike/memory/rust", "net/ts"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
panic = "abort"
debug = "line-tables-only"
codegen-units = 1
lto = true

# The room names' tests (net/ts) check signatures, proof of work and hashes by the thousand over simulated weeks:
# unoptimized, BIP-340's curve and Argon2 take ~10 ms a check and those tests minutes. Optimized in test builds too.
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# The test builds of our crates optimized a little (debug assertions and overflow checks stay on): the Rust tests took
# 64 s under cargo-nextest unoptimized, 26 s so (the baremetal and block-interpreter tests run guest code; net/ts's
# names tests are k256's inlined field arithmetic, compiled in waarm64_ts), and a rebuild after an edit stays ~3 s.
[profile.test.package.waarm64-core]
opt-level = 1
[profile.test.package.waarm64_ts]
opt-level = 2
