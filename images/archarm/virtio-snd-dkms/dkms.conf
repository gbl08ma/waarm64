# virtio-snd-dkms (PKGBUILD beside it): the upstream sound/virtio Makefile, with the driver's config switched on.
PACKAGE_NAME="virtio-snd"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="virtio_snd"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_SND_VIRTIO=m modules"
AUTOINSTALL="yes"
