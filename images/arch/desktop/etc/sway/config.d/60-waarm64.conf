# The desktop guest's sway, closer to a conventional desktop (images/arch/desktop.sh; docs/images.md "Arch Linux"):
# windows float and take focus by a click, a taskbar at the bottom, an application menu, and keys on Alt rather than
# Super (a browser's host may keep that key). Read after sway's own /etc/sway/config, whose bindings it keeps; those
# it changes are marked --no-warn (sway warns about a binding defined twice otherwise).

# No wallpaper: no swaybg.
swaybg_command -

# Windows float, open at their own size, and come to the front when clicked; the mouse alone doesn't move the focus.
for_window [all] floating enable
# Maximized: a floating window the screen's size above the taskbar (a tiled one would stay below every floating
# window, clicked or not). Browsers open maximized, the page in the host's browser leaving the screen little room.
set $maximize resize set width 100ppt height 100ppt, move position 0 0
set $restore resize set width 60ppt height 70ppt, move position center
for_window [app_id="^(firefox|chromium)$"] $maximize
for_window [class="^(firefox|Chromium)$"] $maximize
focus_follows_mouse no
default_border normal 4
default_floating_border normal 4
seat * xcursor_theme Adwaita 24
font pango:DejaVu Sans 10
client.focused #3b6ea5 #3b6ea5 #ffffff #3b6ea5 #3b6ea5
client.focused_inactive #4a4a4a #4a4a4a #dddddd #4a4a4a #4a4a4a
client.unfocused #3a3a3a #3a3a3a #aaaaaa #3a3a3a #3a3a3a

# The application menu: Super alone, Alt+F1 or Alt+F2, and the taskbar's Applications.
set $menu fuzzel
bindsym --no-warn $mod+d exec $menu
bindsym --release Super_L exec $menu
bindsym Alt+F1 exec $menu
bindsym Alt+F2 exec $menu

# Conventional keys, on Alt rather than Super (a host's desktop keeps many Super keys for itself: KDE's Super+Up, the
# Windows key), and none of the Alt+letter, Alt+digit or Alt+arrow keys applications use (Firefox's tabs and history).
bindsym Alt+F4 kill
bindsym Alt+F9 move scratchpad
bindsym Alt+F10 exec waarm64-maximize
bindsym Alt+Tab focus next
bindsym Alt+Shift+Tab focus prev
bindsym Ctrl+Alt+t exec $term
bindsym Ctrl+Alt+Left workspace prev
bindsym Ctrl+Alt+Right workspace next
bindsym Ctrl+Alt+Shift+Left move container to workspace prev, workspace prev
bindsym Ctrl+Alt+Shift+Right move container to workspace next, workspace next
bindsym Ctrl+Alt+1 workspace number 1
bindsym Ctrl+Alt+2 workspace number 2
bindsym Ctrl+Alt+3 workspace number 3
bindsym Ctrl+Alt+4 workspace number 4
bindsym Ctrl+Alt+Delete exec waarm64-power
bindsym F1 exec waarm64-keys
# Alt+drag moves a window, Alt+right-drag resizes it (sway's own default: Super).
floating_modifier Mod1 normal

# Super's too, where the host lets it through: maximize and restore (to a size of its own, centered), minimize (to the
# scratchpad: the taskbar brings it back), the shortcuts' sheet, logging out.
bindsym --no-warn $mod+Up floating enable, $maximize
bindsym --no-warn $mod+Down floating enable, $restore
bindsym $mod+m move scratchpad
bindsym --no-warn $mod+Shift+e exec waarm64-power
bindsym $mod+slash exec waarm64-keys

# A title bar's middle click closes its window.
bindsym --border button2 kill

# The taskbar: sway's own bar (bar-0, /etc/sway/config's) at the bottom, its blocks from waarm64-bar, which fill its
# width (Applications at the left end) and show the workspaces: swaybar's own workspace buttons, binding mode and tray
# would take a width the script doesn't know.
bar bar-0 {
    position bottom
    workspace_buttons no
    binding_mode_indicator no
    tray_output none
    font pango:DejaVu Sans 11
    status_command waarm64-bar
    status_padding 4
    status_edge_padding 0
    separator_symbol ""
    colors {
        statusline #ffffff
        background #262626
        focused_workspace #3b6ea5 #3b6ea5 #ffffff
        active_workspace #4a4a4a #4a4a4a #ffffff
        inactive_workspace #26262600 #26262600 #9a9a9a
    }
}
