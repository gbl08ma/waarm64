# The application menu (Super, Alt+F1, the taskbar's Applications: /etc/sway/config.d/60-waarm64.conf), above the
# taskbar at the screen's bottom left, like a start menu.
[main]
font=DejaVu Sans:size=12
prompt="Search: "
terminal=foot -e
anchor=bottom-left
x-margin=4
y-margin=4
width=40
lines=12
layer=overlay

[colors]
background=262626f2
text=ddddddff
prompt=aaaaaaff
input=ffffffff
match=8fbfefff
selection=3b6ea5ff
selection-text=ffffffff
selection-match=ffffffff
border=3b6ea5ff

[border]
width=2
radius=6
