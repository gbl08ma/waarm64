<!doctype html>
<html lang="en">
<!-- An explicit head element: Vite puts its scripts in it (without one, after the first match of its opening tag, which
     the fallback's toolbar would be). -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webpc</title>
<link rel="icon" href="data:,">
<style>
  /* The page's look (docs/frontend.md): a desktop application's, dark. Components (web/app/*.svelte) style what's theirs. */
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --panel: #15181d; --bar: #1a1e24; --line: #262b33; --text: #d7dce3; --dim: #8a93a0;
    --hover: #262c34; --pressed: #2c3a50; --ok: #4cc38a; --busy: #e0b341; --bad: #e5484d; --off: #6b7280; --accent: #5b9dff;
    font: 14px/1.4 system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--text); background: transparent; border: 0; padding: 4px 12px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .45; cursor: default; background: transparent; }
  select, input:not([type=checkbox]):not([type=range]) { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* The toolbar: tool buttons (an icon, a label on the main ones) in groups. */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px 8px; background: var(--bar); border-bottom: 1px solid var(--line); user-select: none; }
  .toolbar h1 { margin: 0 8px 0 4px; font-size: 14px; font-weight: 600; color: var(--dim); letter-spacing: .02em; }
  .toolbar .sep { width: 1px; height: 22px; margin: 0 6px; background: var(--line); }
  .tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; min-width: 32px; padding: 0 6px; border: 1px solid transparent; border-radius: 4px; color: var(--text); background: transparent; cursor: pointer; list-style: none; }
  .tool.labelled { padding: 0 10px 0 7px; }
  .tool:hover { background: var(--hover); }
  .tool[aria-pressed=true], details.menu[open] > .tool, details.menu[data-on] > .tool { background: var(--pressed); border-color: #3a4d6a; }
  .tool:disabled, .tool[aria-disabled=true] { opacity: .4; cursor: default; background: transparent; }
  .tool .label { font-size: 13px; }
  .tool::-webkit-details-marker { display: none; }
  #machine { margin: 0 6px; font-weight: 600; font-size: 13px; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .views { display: inline-flex; gap: 2px; }

  /* Toolbar menus (web/app/Menu.svelte): a list of commands, or a panel of controls. */
  .menu { position: relative; }
  .menu .items { position: absolute; right: 0; top: calc(100% + 4px); z-index: 2; display: flex; flex-direction: column; min-width: 180px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px #000a; }
  .menu .items > button, .menu .items .fkeys button { display: flex; justify-content: space-between; gap: 12px; text-align: left; border-radius: 4px; padding: 5px 10px; white-space: nowrap; }
  .menu .items .dim { color: var(--dim); font-size: 12px; }
  .menu .items hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu .items .hint { margin: 4px 8px; max-width: 280px; color: var(--dim); font-size: 12px; }
  .menu .items .label { padding: 6px 10px 2px; color: var(--dim); font-size: 12px; }
  .menu .items .fkeys { display: grid; grid-template-columns: repeat(4, 1fr); }
  .menu .items .fkeys button { justify-content: center; padding-left: 4px; padding-right: 4px; }
  .menu .items.panel { width: 260px; gap: 8px; padding: 10px; }
  .menu .items.panel label:not(.check) { display: flex; flex-direction: column; gap: 2px; color: var(--dim); font-size: 12px; }
  .menu .items.panel label.row { flex-direction: row; align-items: center; gap: 6px; color: var(--text); font-size: 14px; }
  .menu .items.panel button { border: 1px solid var(--line); border-radius: 6px; text-align: center; }
  .menu .items.panel .hint { margin: 0; }
  .menu .items .hint.warn { color: #ffb36b; }
  .menu .tag { font-size: 11px; color: var(--accent); }
  #sound-menu[data-waiting] > .tool { border-color: var(--accent); }
  #network .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); }
  #network[data-phase=connecting] .dot, #network[data-phase=login] .dot { background: var(--busy); }
  #network[data-phase=connected] .dot { background: var(--ok); }
  #network[data-phase=error] .dot { background: var(--bad); }
  #network .items.panel { width: 320px; }
  #network .panel p { margin: 0; }
  .net-status { font-weight: 600; }
  .net-adapter { display: flex; flex-direction: column; gap: 8px; }
  .net-adapter + .net-adapter { padding-top: 10px; border-top: 1px solid var(--line); }
  .net-head { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; font-weight: 600; }
  #network .net-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); }
  #network .net-adapter[data-phase=connecting] .net-head .dot, #network .net-adapter[data-phase=login] .net-head .dot { background: var(--busy); }
  #network .net-adapter[data-phase=connected] .net-head .dot { background: var(--ok); }
  #network .net-adapter[data-phase=error] .net-head .dot { background: var(--bad); }
  #net-error, .net-menu-error { color: #ffb4b6; }
  .net-login { display: inline-block; padding: 4px 12px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent); text-decoration: none; text-align: center; }
  .net-note { color: var(--dim); font-size: 12px; margin: 0; }
  .net-note a { color: var(--accent); }
  .net-row { display: flex; gap: 8px; }
  .net-actions { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Dialogs: the Network wizard, Add a disk, the page's questions. */
  dialog { color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px #000a; }
  dialog::backdrop { background: rgb(0 0 0 / 0.55); }
  #net-wizard { width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; }
  #net-wizard label:not(.check) { display: flex; flex-direction: column; gap: 2px; color: var(--dim); font-size: 12px; }
  #net-form { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
  #net-form h2 { margin: 0; font-size: 16px; }
  .net-step { display: flex; flex-direction: column; gap: 10px; }
  .choice { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .choice:hover, .choice:focus-visible { border-color: var(--accent); background: var(--bg); }
  .choice span { color: var(--dim); font-size: 12px; }
  .net-choice { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .net-choice:hover, .net-choice:focus-visible { border-color: var(--accent); }
  .net-choice span { color: var(--dim); font-size: 12px; }
  .net-choice[aria-pressed=true] { border-color: var(--accent); background: var(--pressed); }
  .net-sub { display: flex; flex-direction: column; gap: 8px; margin-left: 24px; }
  #net-wizard details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  #net-wizard details[open] { display: flex; flex-direction: column; gap: 8px; }
  #net-wizard code { font-size: 12px; }
  .net-buttons { display: flex; gap: 8px; }
  .net-buttons .grow { flex: 1; }
  #net-wizard button:not(.net-choice) { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  #net-wizard #net-connect { border-color: var(--accent); }

  /* The message bar. */
  #message { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; padding: 10px 16px; background: #2a1215; color: #ffb4b6; border-bottom: 1px solid #5c1d22; }
  #message[data-kind=warn] { background: #2a2312; color: #f3d98b; border-color: #5c4b1d; }
  #message-text { flex: 1 1 480px; margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; max-height: 30vh; overflow: auto; }
  #message-text::first-line { font-weight: 600; }
  #message-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #message-actions button { border: 1px solid currentColor; border-radius: 6px; color: inherit; }
  #message .close { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; margin-left: auto; border-radius: 4px; color: inherit; }

  /* The machine: its screen, its serial terminal, or both. */
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
  #screen-view { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #screen-frame { position: relative; display: flex; }
  #screen { background: #000; outline: none; box-shadow: 0 0 0 1px var(--line); touch-action: none; }
  #screen:focus { box-shadow: 0 0 0 2px var(--accent); }
  #screen-hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: #000c; color: var(--text); font-size: 12px; pointer-events: none; }
  /* The guest's cursor under the mouse lock: clipped to the screen, as a cursor is, so it never makes the page overflow. */
  #screen-cursor-clip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #screen-cursor { position: absolute; left: 0; top: 0; }
  #screen:focus + #screen-hint, body:not([data-state=running]):not([data-state=booting]) #screen-hint { display: none; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; background: #000; color: var(--dim); pointer-events: none; }
  #boot-title { color: var(--text); font-size: 15px; }
  #boot progress { width: min(320px, 80%); height: 6px; accent-color: var(--accent); }
  #boot-serial { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; pointer-events: auto; }
  #boot-line { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, monospace; font-size: 12px; }
  #terminal-view { min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
  #terminal { padding: 8px; background: #0b0d10; border: 1px solid var(--line); border-radius: 4px; }
  #terminal:focus-within { border-color: var(--accent); }
  main:fullscreen { background: var(--bg); }
  /* Full screen with the status bar (Preferences): the page, without its toolbar and message bar. */
  body:fullscreen > header, body:fullscreen > #message { display: none; }
  body[data-view=screen] #terminal-view, body[data-view=terminal] #screen-view { display: none; }
  body[data-view=terminal] #terminal-view { flex: 1; }
  body[data-view=screen] main { padding: 0; }
  body[data-view=screen] #screen-view { background: #000; }
  body[data-view=screen] #screen { box-shadow: none; }
  body[data-view=both] main { flex-direction: row; }
  /* The Machines page takes the machine's place; the machine runs on behind it. */
  body[data-page=machines] main { display: none; }
  /* The status bar: the power state first, then the machine's numbers. */
  footer { display: flex; align-items: center; gap: 16px; padding: 5px 16px; border-top: 1px solid var(--line); background: var(--bar); color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 29px; }
  @media (max-width: 1100px) { body[data-view=both] main { flex-direction: column; } }
</style>
</head>
<script>
  // The page's scripts didn't load (a module of the bundle, or of the dev server's graph): say so, as the page would.
  addEventListener('error', (e) => {
    if (!(e.target instanceof HTMLScriptElement) || document.getElementById('state')) return;
    document.body.innerHTML = '<header class=toolbar><h1>webpc</h1></header><div id=message role=alert><pre id=message-text></pre></div><main></main><footer><span id=state data-state=failed>Couldn\'t start</span></footer>';
    document.getElementById('message-text').textContent = 'The page\'s scripts didn\'t load.\nRun `npm start` in the repository: it builds the page, then serves it.'
  }, true);
</script>
<script type="module" src="./main.ts"></script>
</html>
