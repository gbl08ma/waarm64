<!doctype html>
<html lang="en">
<!-- An explicit head element: Vite puts its scripts in it (without one, after the first match of its opening tag, which
     the fallback's toolbar would be). -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>waarm64</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./theme/tokens.css">
<link rel="stylesheet" href="./theme/base.css">
<!-- The page's look is the theme's (tokens, element defaults) and its components'. These rules are the fallback's
     below, the one thing on the page that isn't a component: the page as it would be, saying it couldn't start. -->
<style>
  .fallback-bar { display: flex; align-items: center; min-height: calc(var(--tool-h) + 2 * var(--space-2)); padding: var(--space-2) var(--space-3); background: var(--surface-bar); border-bottom: 1px solid var(--border); }
  .fallback-bar h1 { margin: 0 var(--space-3) 0 var(--space-2); font-size: var(--text-base); font-weight: var(--weight-bold); color: var(--text-dim); }
  .fallback-message { margin: 0; padding: var(--space-3) var(--space-5); white-space: pre-wrap; font-family: var(--font-mono); font-size: var(--text-sm); color: var(--error-bar-fg); background: var(--error-bg); border-bottom: 1px solid var(--error-border); }
  .fallback-main { flex: 1; }
  .fallback-status { padding: var(--space-2) var(--space-5); border-top: 1px solid var(--border); background: var(--surface-bar); color: var(--text-dim); font-size: var(--text-sm); }
</style>
</head>
<script>
  // The page's scripts didn't load (a module of the bundle, or of the dev server's graph): say so, as the page would.
  addEventListener('error', (e) => {
    if (!(e.target instanceof HTMLScriptElement) || document.getElementById('state')) return;
    document.body.innerHTML = '<header class="toolbar fallback-bar"><h1>waarm64</h1></header><div id=message role=alert><pre id=message-text class=fallback-message></pre></div><main class=fallback-main></main><footer class=fallback-status><span id=state data-state=failed>Couldn\'t start</span></footer>';
    document.getElementById('message-text').textContent = 'The page\'s scripts didn\'t load.\nRun `npm start` in the repository: it builds the page, then serves it.'
  }, true);
</script>
<script type="module" src="./main.ts"></script>
</html>
