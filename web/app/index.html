<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webpc</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
<script type="importmap">{ "imports": { "@xterm/xterm": "../../node_modules/@xterm/xterm/lib/xterm.mjs" } }</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --panel: #15181d; --line: #262b33; --text: #d7dce3; --dim: #8a93a0;
    --ok: #4cc38a; --busy: #e0b341; --bad: #e5484d; --off: #6b7280; --accent: #5b9dff;
    font: 14px/1.4 system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #machine { color: var(--dim); }
  #state { display: inline-flex; align-items: center; gap: 6px; }
  #state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--busy); }
  #state[data-state=running]::before { background: var(--ok); }
  #state[data-state=off]::before { background: var(--off); }
  #state[data-state=crashed]::before, #state[data-state=failed]::before { background: var(--bad); }
  #state[data-state=idle]::before { background: var(--off); }
  .spacer { flex: 1; }
  .views { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  button { font: inherit; color: var(--text); background: transparent; border: 0; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #1e232a; }
  .views button[aria-pressed=true] { background: #253044; color: #fff; }
  #restart, #reset-disk, #open-disk { border: 1px solid var(--line); border-radius: 6px; }
  #message { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; padding: 10px 16px; background: #2a1215; color: #ffb4b6; border-bottom: 1px solid #5c1d22; }
  #message[data-kind=warn] { background: #2a2312; color: #f3d98b; border-color: #5c4b1d; }
  #message[hidden] { display: none; }
  #message-text { flex: 1 1 480px; margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; max-height: 30vh; overflow: auto; }
  #message-text::first-line { font-weight: 600; }
  #message-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #message-actions button { border: 1px solid currentColor; border-radius: 6px; color: inherit; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px; }
  #screen-view { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #screen-frame { position: relative; display: flex; }
  #screen { background: #000; outline: none; box-shadow: 0 0 0 1px var(--line); touch-action: none; }
  #screen:focus { box-shadow: 0 0 0 2px var(--accent); }
  #screen-hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 4px 12px; border-radius: 999px; background: #000c; color: var(--text); font-size: 12px; pointer-events: none; }
  #screen:focus + #screen-hint, body:not([data-state=running]):not([data-state=booting]) #screen-hint { display: none; }
  #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; background: #000; color: var(--dim); pointer-events: none; }
  #boot[hidden] { display: none; }
  #boot-title { color: var(--text); font-size: 15px; }
  #boot progress { width: min(320px, 80%); height: 6px; accent-color: var(--accent); }
  #boot-serial { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; pointer-events: auto; }
  #boot-serial[hidden] { display: none; }
  #boot-line { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: ui-monospace, monospace; font-size: 12px; }
  #terminal-view { min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
  #terminal { padding: 8px; background: #0b0d10; border: 1px solid var(--line); border-radius: 4px; }
  #terminal:focus-within { border-color: var(--accent); }
  main:fullscreen { background: var(--bg); }
  .menu { position: relative; }
  .menu summary { list-style: none; cursor: pointer; padding: 4px 12px; border: 1px solid var(--line); border-radius: 6px; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary::after { content: ' ▾'; color: var(--dim); }
  .menu[open] summary, .menu summary:hover { background: #1e232a; }
  .menu .items { position: absolute; right: 0; top: calc(100% + 4px); z-index: 1; display: flex; flex-direction: column; min-width: 150px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 20px #0008; }
  .menu .items button { text-align: left; border-radius: 4px; }
  .menu .items .label { padding: 6px 8px 2px; color: var(--dim); font-size: 12px; }
  .menu .items .fkeys { display: grid; grid-template-columns: repeat(4, 1fr); }
  .menu .items .fkeys button { text-align: center; padding-left: 4px; padding-right: 4px; }
  #network summary::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--off); }
  #network[data-phase=connecting] summary::before, #network[data-phase=login] summary::before { background: var(--busy); }
  #network[data-phase=connected] summary::before { background: var(--ok); }
  #network[data-phase=error] summary::before { background: var(--bad); }
  #network .panel { width: 320px; gap: 8px; padding: 10px; }
  #network .panel p { margin: 0; }
  #network [hidden] { display: none !important; }
  #net-status { font-weight: 600; }
  #net-hint, #net-error { color: var(--dim); font-size: 12px; }
  #net-error { color: #ffb4b6; }
  #net-login { display: inline-block; padding: 4px 12px; border: 1px solid var(--accent); border-radius: 6px; color: var(--accent); text-decoration: none; text-align: center; }
  #net-form { display: flex; flex-direction: column; gap: 8px; }
  #net-form label { display: flex; flex-direction: column; gap: 2px; color: var(--dim); font-size: 12px; }
  #net-form input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  #network .panel button { border: 1px solid var(--line); border-radius: 6px; text-align: center; }
  #net-exit-label { display: flex; flex-direction: column; gap: 2px; color: var(--dim); font-size: 12px; }
  #net-exit { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  #net-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  #fullscreen { border: 1px solid var(--line); border-radius: 6px; }
  body[data-view=screen] #terminal-view, body[data-view=terminal] #screen-view { display: none; }
  body[data-view=terminal] #terminal-view { flex: 1; }
  body[data-view=both] main { flex-direction: row; }
  footer { padding: 6px 16px; border-top: 1px solid var(--line); background: var(--panel); color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 29px; }
  @media (max-width: 1100px) { body[data-view=both] main { flex-direction: column; } }
</style>
<header>
  <h1>webpc</h1>
  <span id="machine"></span>
  <span id="state" data-state="loading">Loading</span>
  <span class="spacer"></span>
  <span class="views" role="group" aria-label="View">
    <button data-view-button="screen">Screen</button><button data-view-button="terminal">Serial terminal</button><button data-view-button="both">Both</button>
  </span>
  <details class="menu" id="network" data-phase="off" hidden><summary title="Connect the machine's network card to a Tailscale network">Network</summary><div class="items panel">
    <p id="net-status"></p>
    <a id="net-login" target="_blank" rel="noopener" hidden>Log in…</a>
    <form id="net-form">
      <label>Control server<input id="net-control" placeholder="Tailscale (default), or a Headscale's URL" autocomplete="off" spellcheck="false"></label>
      <label>Hostname<input id="net-hostname" placeholder="webpc" autocomplete="off" spellcheck="false"></label>
      <label>Auth key (optional, never saved)<input id="net-authkey" type="password" autocomplete="off" spellcheck="false"></label>
      <button id="net-connect" type="submit">Connect</button>
    </form>
    <p id="net-error" hidden></p>
    <label id="net-exit-label" hidden>Internet through<select id="net-exit"></select></label>
    <div id="net-actions"><button id="net-disconnect">Disconnect</button><button id="net-logout" title="Remove this machine from the tailnet and forget its keys">Log out</button></div>
    <p id="net-hint"></p>
  </div></details>
  <details class="menu" id="keys"><summary title="Key combinations the browser keeps for itself, sent to the screen's keyboard">Keys</summary><div class="items">
    <button data-chord="ControlLeft AltLeft Delete">Ctrl+Alt+Del</button>
    <div class="label">Ctrl+Alt+</div>
    <div class="fkeys" id="fkeys"></div>
  </div></details>
  <button id="fullscreen" title="Full screen: browser shortcuts (Ctrl+W, Ctrl+T) and Esc go to the machine; hold Esc to leave">Full screen</button>
  <button id="open-disk" title="Boot a disk image of your own: a qcow2 or raw file (or drop one on the page)">Open disk…</button><input type="file" id="open-disk-input" hidden>
  <button id="reset-disk" title="Delete what the machine wrote to its disk and boot from the image again" hidden>Reset disk</button>
  <button id="restart">Restart</button>
</header>
<div id="message" role="alert" hidden><pre id="message-text"></pre><div id="message-actions"></div></div>
<main>
  <div id="screen-view"><div id="screen-frame"><canvas id="screen" tabindex="0" aria-label="Machine screen"></canvas><div id="screen-hint">Click to type</div><div id="boot"><div id="boot-title"></div><progress id="boot-progress"></progress><div id="boot-line"></div><div id="boot-serial" hidden><span>The boot menus, and a first boot's questions, are on the serial console.</span><button id="boot-serial-show">Show it</button></div></div></div></div>
  <div id="terminal-view"><div id="terminal"></div></div>
</main>
<footer id="status"></footer>
<script type="module" src="./main.ts" onerror="document.getElementById('message-text').textContent = 'The page\'s scripts didn\'t load (is xterm.js installed in node_modules?).\nRun `npm start` in the repository: it installs what the page needs, then serves it.'; document.getElementById('message').hidden = false; document.getElementById('state').dataset.state = 'failed'; document.getElementById('state').textContent = 'Couldn\'t start'"></script>
</html>
