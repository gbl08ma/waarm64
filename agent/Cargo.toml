# The guest's clipboard agent (docs/plans/clipboard.md §3, docs/devices.md "The guest's agent"): a static aarch64 musl binary
# the page delivers over fw_cfg. Its own workspace and toolchain (rust-toolchain.toml), outside the core's: built by
# `images/build.sh agent` in rootless Podman (without Podman, with the host's cargo: docs/images.md "agent").
[workspace]

[package]
name = "waarm64-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The one dependency (plan §3.3, the user's choice): raw Linux syscalls, no libc wrapper. Without `std`: the agent is
# `no_std` (src/rt.rs).
rustix = { version = "1.1", default-features = false, features = ["alloc", "event", "fs", "net", "pipe", "process", "rand", "termios", "thread", "time"] }


# The binary has no unwinder (src/rt.rs), in every profile; the tests' harness unwinds whatever this says.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
