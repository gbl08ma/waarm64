<!doctype html>
<!-- VK3 L7.4: ANGLE's ES3 row's program, a WebGL2 page for the guest's Chromium (bench/vulkan/dawn-frames.ts guest with
     PAGE=bench/vulkan/angle/es3.html): its renderer, ES3's limits, a flat varying from the last vertex (GL's
     convention), transform feedback and 13 uniform blocks a stage, each logged as "dawn: <what> <value>";
     VK4 T45: the capture's TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN query (Venus's transform feedback queries), "xfbq 4". -->
<meta charset="utf-8">
<canvas id="c" width="64" height="64"></canvas>
<script>
const log = (m) => console.log(`dawn: ${m}`);
try {
  const gl = document.getElementById('c').getContext('webgl2');
  if (!gl) throw new Error('no webgl2');
  const info = gl.getExtension('WEBGL_debug_renderer_info');
  log(`adapter ${info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)} | ${gl.getParameter(gl.VERSION)}`);
  log(`limits ${[gl.MAX_VERTEX_UNIFORM_BLOCKS, gl.MAX_FRAGMENT_UNIFORM_BLOCKS, gl.MAX_COMBINED_UNIFORM_BLOCKS, gl.MAX_TRANSFORM_FEEDBACK_INTERLEAVED_COMPONENTS].map((p) => gl.getParameter(p)).join(',')}`);
  const program = (vs, fs, varyings) => {
    const p = gl.createProgram();
    for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      gl.attachShader(p, s);
    }
    if (varyings) gl.transformFeedbackVaryings(p, varyings, gl.INTERLEAVED_ATTRIBS);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  };
  // A triangle, each vertex its colour, flat: GL's last vertex provokes (blue).
  const flat = program(`#version 300 es
    const vec2 p[3] = vec2[3](vec2(-1, -1), vec2(3, -1), vec2(-1, 3));
    const vec3 c[3] = vec3[3](vec3(1, 0, 0), vec3(0, 1, 0), vec3(0, 0, 1));
    flat out vec3 col;
    void main() { gl_Position = vec4(p[gl_VertexID], 0, 1); col = c[gl_VertexID]; }`, `#version 300 es
    precision mediump float; flat in vec3 col; out vec4 o; void main() { o = vec4(col, 1); }`);
  gl.useProgram(flat);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const px = new Uint8Array(4);
  gl.readPixels(32, 32, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  log(`flat ${[...px].join(',')}`);
  // Transform feedback: four points' (id, id * 2, 7, 1) captured, rasterizer discard on.
  const xfb = program(`#version 300 es
    out vec4 v; void main() { v = vec4(float(gl_VertexID), float(gl_VertexID) * 2.0, 7.0, 1.0); gl_Position = vec4(0, 0, 0, 1); gl_PointSize = 1.0; }`, `#version 300 es
    precision mediump float; out vec4 o; void main() { o = vec4(1); }`, ['v']);
  gl.useProgram(xfb);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, buf);
  gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, 64, gl.STATIC_READ);
  const tf = gl.createTransformFeedback();
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, buf);
  gl.enable(gl.RASTERIZER_DISCARD);
  const query = gl.createQuery();
  gl.beginQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN, query);
  gl.beginTransformFeedback(gl.POINTS);
  gl.drawArrays(gl.POINTS, 0, 4);
  gl.endTransformFeedback();
  gl.endQuery(gl.TRANSFORM_FEEDBACK_PRIMITIVES_WRITTEN);
  gl.disable(gl.RASTERIZER_DISCARD);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
  const got = new Float32Array(16);
  gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, buf);
  gl.getBufferSubData(gl.TRANSFORM_FEEDBACK_BUFFER, 0, got);
  log(`xfb ${[...got].join(',')}`);
  // 12 uniform blocks in each stage (ES3's minimum; ANGLE adds its own): each block's value summed.
  const blocks = (n, prefix) => Array.from({ length: n }, (_, i) => `uniform ${prefix}${i} { float v; } ${prefix}b${i};`).join('\n');
  const sum = (n, prefix) => Array.from({ length: n }, (_, i) => `${prefix}b${i}.v`).join(' + ');
  const ubo = program(`#version 300 es
    ${blocks(12, 'V')}
    out float s; void main() { s = ${sum(12, 'V')}; gl_Position = vec4(gl_VertexID == 1 ? 3.0 : -1.0, gl_VertexID == 2 ? 3.0 : -1.0, 0, 1); }`, `#version 300 es
    precision highp float; ${blocks(12, 'F')}
    in float s; out vec4 o; void main() { o = vec4((s + ${sum(12, 'F')}) / 255.0, 0, 0, 1); }`);
  gl.useProgram(ubo);
  for (const [k, prefix] of [[0, 'V'], [12, 'F']]) {
    for (let i = 0; i < 12; i++) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.UNIFORM_BUFFER, b);
      gl.bufferData(gl.UNIFORM_BUFFER, new Float32Array([i + 1, 0, 0, 0]), gl.STATIC_DRAW);
      gl.uniformBlockBinding(ubo, gl.getUniformBlockIndex(ubo, `${prefix}${i}`), k + i);
      gl.bindBufferBase(gl.UNIFORM_BUFFER, k + i, b);
    }
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(32, 32, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  log(`ubo ${[...px].join(',')}`);
  log(`glerror ${gl.getError()}`);
  // The query's result once available (a later frame's).
  let frames = 0;
  const poll = () => {
    if (gl.getQueryParameter(query, gl.QUERY_RESULT_AVAILABLE)) {
      log(`xfbq ${gl.getQueryParameter(query, gl.QUERY_RESULT)}`);
      log('done');
    } else if (++frames > 600) {
      log('xfbq unavailable');
      log('done');
    } else {
      requestAnimationFrame(poll);
    }
  };
  requestAnimationFrame(poll);
} catch (e) {
  log(`failed ${e}`);
}
</script>
