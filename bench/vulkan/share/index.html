<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<script type="module">
  // bench/vulkan/share.ts calls `share(request)`: its worker (./worker.ts) measures the candidates.
  window.share = (req) => new Promise((resolve) => {
    const w = new Worker(new URL('./worker.ts', import.meta.url), { type: 'module' });
    w.onmessage = (e) => { resolve(e.data); w.terminate(); };
    w.onerror = (e) => resolve({ error: String(e.message) });
    w.postMessage(req);
  });
  window.ready = true;
</script>
