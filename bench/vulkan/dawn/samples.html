<!doctype html><html><head><meta charset="utf-8"><title>dawn samples</title>
<style>body { margin: 0; background: #000; color: #fff; font: 14px monospace; } canvas { position: absolute; image-rendering: pixelated; }</style></head>
<body><div id="log" style="position: absolute; left: 8px; top: 540px"></div><script>
// WebGPU samples for VK3 L7.1 (bench/vulkan/dawn-frames.ts): each scene drawn once, deterministically, into a 256x256
// rgba8unorm texture and read back; the readbacks shown on 2D canvases (scene k at x = 8 + 264 k, y = 8), the first also
// presented through a WebGPU canvas below (y = 272). window.__dawn holds the result (adapter, pixels, errors).
const S = 256, SCENES = ['triangle', 'msaa', 'cube', 'compute', 'samplerate'];
const say = (m) => { document.getElementById('log').textContent += m + ' | '; console.log('dawn: ' + m); };
const tri = `struct V { @builtin(position) p: vec4f, @location(0) c: vec4f }
fn corner(i: u32) -> V {
  var p = array(vec2f(0.0, 0.8), vec2f(-0.8, -0.7), vec2f(0.75, -0.6));
  var c = array(vec4f(1, 0.2, 0.1, 1), vec4f(0.1, 1, 0.3, 1), vec4f(0.2, 0.3, 1, 1));
  return V(vec4f(p[i], 0, 1), c[i]);
}
@vertex fn vs(@builtin(vertex_index) i: u32) -> V { return corner(i); }
@fragment fn fs(v: V) -> @location(0) vec4f { return v.c; }
struct W { @builtin(position) p: vec4f, @location(0) @interpolate(perspective, sample) c: vec4f }
@vertex fn vss(@builtin(vertex_index) i: u32) -> W { let v = corner(i); return W(v.p, v.c); }
@fragment fn fss(@location(0) @interpolate(perspective, sample) c: vec4f, @builtin(sample_index) s: u32) -> @location(0) vec4f {
  return vec4f(c.rgb * (0.25 + 0.25 * f32(s)), 1);
}`;
const cube = `struct U { m: mat4x4f }
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var t: texture_2d<f32>;
@group(0) @binding(2) var s: sampler;
struct V { @builtin(position) p: vec4f, @location(0) uv: vec2f, @location(1) l: f32 }
@vertex fn vs(@builtin(vertex_index) i: u32) -> V {
  let f = i / 6u; let k = array(0u, 1u, 2u, 2u, 1u, 3u)[i % 6u];
  let a = vec2f(f32(k & 1u), f32(k >> 1u)) * 2.0 - 1.0;
  var q: vec3f; var n: vec3f; let sg = select(-1.0, 1.0, f % 2u == 0u);
  if (f < 2u) { q = vec3f(a.x * sg, a.y, sg); n = vec3f(0, 0, sg); }
  else if (f < 4u) { q = vec3f(sg, a.y, -a.x * sg); n = vec3f(sg, 0, 0); }
  else { q = vec3f(a.x, sg, -a.y * sg); n = vec3f(0, sg, 0); }
  let w = u.m * vec4f(q, 1); let wn = normalize((u.m * vec4f(n, 0)).xyz);
  return V(vec4f(w.xy, w.z * 0.1 + 0.5, w.w), a * 0.5 + 0.5, 0.35 + 0.65 * max(dot(wn, normalize(vec3f(0.4, 0.6, -1))), 0));
}
@fragment fn fs(v: V) -> @location(0) vec4f { return vec4f(textureSample(t, s, v.uv).rgb * v.l, 1); }`;
const comp = `@group(0) @binding(0) var o: texture_storage_2d<rgba8unorm, write>;
@group(0) @binding(1) var<storage, read_write> b: array<atomic<u32>>;
@compute @workgroup_size(8, 8) fn main(@builtin(global_invocation_id) g: vec3u) {
  var z = vec2f(0); let c = (vec2f(g.xy) / 256.0) * vec2f(3.0, 2.6) - vec2f(2.1, 1.3); var n = 0u;
  for (; n < 48u && dot(z, z) < 4.0; n++) { z = vec2f(z.x * z.x - z.y * z.y, 2 * z.x * z.y) + c; }
  atomicAdd(&b[n % 4u], 1u);
  let v = f32(n) / 48.0;
  textureStore(o, g.xy, vec4f(v, v * v, sqrt(v), 1));
}`;
const show = `@group(0) @binding(0) var t: texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f { let q = vec2f(f32((i << 1u) & 2u), f32(i & 2u)); return vec4f(q * 2 - 1, 0, 1); }
@fragment fn fs(@builtin(position) p: vec4f) -> @location(0) vec4f { return textureLoad(t, vec2i(p.xy), 0); }`;
async function run() {
  const r = { adapter: null, errors: [], scenes: {} };
  window.__dawn = r;
  // Every adapter Dawn offers, by the options that pick one (the first is used).
  for (const o of [{ powerPreference: 'low-power' }, { featureLevel: 'compatibility' }, { forceFallbackAdapter: true }]) {
    const a = await navigator.gpu?.requestAdapter(o).catch(() => null);
    say(`offered ${Object.entries(o).flat().join('=')}: ${a ? `${a.info.vendor} ${a.info.architecture} ${a.info.description}` : 'none'}`);
  }
  const adapter = await navigator.gpu?.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { say('no adapter'); r.done = true; return; }
  r.adapter = `${adapter.info.vendor} ${adapter.info.architecture} ${adapter.info.device} ${adapter.info.description}`.trim();
  say('adapter ' + r.adapter + (adapter.isCompatibilityMode ? ' (compat)' : '') + ' core ' + adapter.features.has('core-features-and-limits'));
  const d = await adapter.requestDevice();
  d.onuncapturederror = (e) => { r.errors.push(e.error.message); say('error ' + e.error.message); };
  const fmt = 'rgba8unorm', U = GPUTextureUsage;
  const target = (samples = 1) => d.createTexture({ size: [S, S], format: fmt, sampleCount: samples, usage: U.RENDER_ATTACHMENT | (samples > 1 ? 0 : U.COPY_SRC | U.TEXTURE_BINDING) });
  const mod = (code) => d.createShaderModule({ code });
  async function read(tex) {
    const buf = d.createBuffer({ size: S * S * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const e = d.createCommandEncoder(); e.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: S * 4 }, [S, S]); d.queue.submit([e.finish()]);
    await buf.mapAsync(GPUMapMode.READ); const px = new Uint8Array(buf.getMappedRange()).slice(); buf.unmap(); return px;
  }
  const pass = (e, view, resolve, depth) => e.beginRenderPass({ colorAttachments: [{ view, resolveTarget: resolve, loadOp: 'clear', storeOp: 'store', clearValue: [0.05, 0.05, 0.1, 1] }],
    depthStencilAttachment: depth && { view: depth, depthLoadOp: 'clear', depthStoreOp: 'store', depthClearValue: 1 } });
  async function scene(name) {
    const out = target(), e = d.createCommandEncoder();
    if (name === 'triangle' || name === 'msaa' || name === 'samplerate') {
      const n = name === 'triangle' ? 1 : 4, m = mod(tri);
      const p = d.createRenderPipeline({ layout: 'auto', vertex: { module: m, entryPoint: name === 'samplerate' ? 'vss' : 'vs' }, multisample: { count: n },
        fragment: { module: m, entryPoint: name === 'samplerate' ? 'fss' : 'fs', targets: [{ format: fmt }] } });
      const ms = n > 1 ? target(n) : null, pe = pass(e, (ms ?? out).createView(), ms ? out.createView() : undefined);
      pe.setPipeline(p); pe.draw(3); pe.end();
    } else if (name === 'cube') {
      const tex = d.createTexture({ size: [64, 64], format: fmt, usage: U.TEXTURE_BINDING | U.COPY_DST });
      const px = new Uint8Array(64 * 64 * 4);
      for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) { const o = (y * 64 + x) * 4, c = ((x >> 3) ^ (y >> 3)) & 1; px.set(c ? [230, 180, 40, 255] : [40, 90, 200, 255], o); }
      d.queue.writeTexture({ texture: tex }, px, { bytesPerRow: 256 }, [64, 64]);
      const a = 0.6, b = 0.45, ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), k = 0.45;
      // A rotation about y then x, scaled (column-major), w = 1: an orthographic cube.
      const m = new Float32Array([k * ca, k * sa * sb, -k * sa * cb, 0, 0, k * cb, k * sb, 0, k * sa, -k * ca * sb, k * ca * cb, 0, 0, 0, 0, 1]);
      const ub = d.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }); d.queue.writeBuffer(ub, 0, m);
      const sm = mod(cube), p = d.createRenderPipeline({ layout: 'auto', vertex: { module: sm, entryPoint: 'vs' }, fragment: { module: sm, entryPoint: 'fs', targets: [{ format: fmt }] },
        primitive: { cullMode: 'back' }, depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' } });
      const depth = d.createTexture({ size: [S, S], format: 'depth24plus', usage: U.RENDER_ATTACHMENT });
      const g = d.createBindGroup({ layout: p.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ub } }, { binding: 1, resource: tex.createView() },
        { binding: 2, resource: d.createSampler({ magFilter: 'linear', minFilter: 'linear' }) }] });
      const pe = pass(e, out.createView(), undefined, depth.createView()); pe.setPipeline(p); pe.setBindGroup(0, g); pe.draw(36); pe.end();
    } else if (name === 'compute') {
      const st = d.createTexture({ size: [S, S], format: fmt, usage: U.STORAGE_BINDING | U.TEXTURE_BINDING });
      const cnt = d.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE });
      const cp = d.createComputePipeline({ layout: 'auto', compute: { module: mod(comp), entryPoint: 'main' } });
      const ce = e.beginComputePass(); ce.setPipeline(cp); ce.setBindGroup(0, d.createBindGroup({ layout: cp.getBindGroupLayout(0), entries: [{ binding: 0, resource: st.createView() }, { binding: 1, resource: { buffer: cnt } }] }));
      ce.dispatchWorkgroups(S / 8, S / 8); ce.end();
      const sm = mod(show), p = d.createRenderPipeline({ layout: 'auto', vertex: { module: sm, entryPoint: 'vs' }, fragment: { module: sm, entryPoint: 'fs', targets: [{ format: fmt }] } });
      const pe = pass(e, out.createView()); pe.setPipeline(p); pe.setBindGroup(0, d.createBindGroup({ layout: p.getBindGroupLayout(0), entries: [{ binding: 0, resource: st.createView() }] })); pe.draw(3); pe.end();
    }
    d.queue.submit([e.finish()]);
    return read(out);
  }
  for (const [k, name] of SCENES.entries()) {
    try {
      const px = await scene(name);
      r.scenes[name] = Array.from(px);
      const c = document.createElement('canvas'); c.width = c.height = S; c.style.left = (8 + 264 * k) + 'px'; c.style.top = '8px'; document.body.appendChild(c);
      c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(px), S, S), 0, 0);
      let sum = 0; for (let i = 0; i < px.length; i += 97) sum = (sum * 31 + px[i]) >>> 0;
      say(`${name} ${sum.toString(16)}`);
    } catch (e) { r.errors.push(`${name}: ${e.message}`); say(`${name} threw ${e.message}`); }
  }
  // The first scene presented through a WebGPU canvas too (Chromium's own path to the screen; #nocanvas: not, as on
  // SwiftShader, whose WebGPU canvas loses the GPU channel).
  if (!location.hash.includes('nocanvas')) try {
    const c = document.createElement('canvas'); c.width = c.height = S; c.style.left = '8px'; c.style.top = '272px'; document.body.appendChild(c);
    const ctx = c.getContext('webgpu'); ctx.configure({ device: d, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: 'opaque' });
    const m = mod(tri), p = d.createRenderPipeline({ layout: 'auto', vertex: { module: m, entryPoint: 'vs' }, fragment: { module: m, entryPoint: 'fs', targets: [{ format: navigator.gpu.getPreferredCanvasFormat() }] } });
    const frame = () => { const e = d.createCommandEncoder(), pe = pass(e, ctx.getCurrentTexture().createView()); pe.setPipeline(p); pe.draw(3); pe.end(); d.queue.submit([e.finish()]); requestAnimationFrame(frame); };
    frame();
  } catch (e) { r.errors.push(`canvas: ${e.message}`); say(`canvas threw ${e.message}`); }
  await d.queue.onSubmittedWorkDone();
  r.done = true;
  say('done');
}
run().catch((e) => { say('failed ' + e.message); (window.__dawn ??= {}).done = true; });
</script></body></html>
