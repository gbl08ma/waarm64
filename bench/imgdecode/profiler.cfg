// desktop-disk.sh appends this to Firefox's waarm64.cfg (bench/gpu/firefox/): with FFBENCH_DUMP=<file> in the environment,
// the running profiler (MOZ_PROFILER_STARTUP) saves every process's profile to <file> once <file>.go exists (polled
// each second), then writes <file>.done. desktop.ts GECKO=1 uses it: a release build writes no MOZ_PROFILER_SHUTDOWN file.
try {
  const dump = Services.env.get("FFBENCH_DUMP");
  if (dump) {
    const { setInterval, clearInterval } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
    const exists = (p) => { const f = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile); f.initWithPath(p); return f.exists(); };
    const t = setInterval(async () => {
      if (!exists(dump + ".go")) return;
      clearInterval(t);
      let msg = "ok";
      try { await Services.profiler.dumpProfileToFileAsync(dump); } catch (e) { msg = String(e); }
      const f = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
      f.initWithPath(dump + ".done");
      const os = Components.classes["@mozilla.org/network/file-output-stream;1"].createInstance(Components.interfaces.nsIFileOutputStream);
      os.init(f, 0x02 | 0x08 | 0x20, 0o644, 0);
      os.write(msg, msg.length);
      os.close();
    }, 1000);
  }
} catch (e) {
  Components.utils.reportError(e);
}
