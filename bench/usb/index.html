<!doctype html>
<meta charset="utf-8">
<title>WebUSB sizing</title>
<script type="module">
  // bench/usb/run.ts drives this: each call starts a fresh dedicated worker (bench/usb/worker.js).
  window.inWorker = (msg) => new Promise((resolve, reject) => {
    const w = new Worker('worker.js');
    w.onmessage = (e) => { w.terminate(); e.data.type === 'error' ? reject(new Error(e.data.message)) : resolve(e.data); };
    w.onerror = (e) => { w.terminate(); reject(new Error(e.message)); };
    w.postMessage(msg);
  });
  window.onPage = async () => (await navigator.usb.getDevices()).map((d) => `${d.serialNumber ?? '-'} ${d.deviceVersionMajor}.${d.deviceVersionMinor}${d.deviceVersionSubminor}`);
</script>
