<!doctype html>
<meta charset="utf-8">
<title>mem</title>
<style>html, body { margin: 0; height: 100%; background: #123; color: #cde; font: 20px monospace; overflow: hidden } div { padding: 1em }</style>
<div id="o">starting</div>
<script>
// A controllable memory load (bench/boot/results/m8-spill/tools/numa-desktop.ts): ?<mb>:<id>:<period ms> (no & or
// comma: sway's exec runs the command line through sh). A worker
// (its own thread, so the content process's main thread stays free for the other tabs) allocates n MB in a
// Float64Array, writes it once, then every period ms reads every 64-byte line of it (a sum), and the page writes
// `MEMSWEEP <id> <ms> <mb>` to Firefox's stdout (dump) and shows it. The array stays reachable and is read each sweep, so
// all of it stays in the guest's active set.
const q = location.search.slice(1).split(':');
const mb = Number(q[0] || 256), id = q[1] || '0', period = Number(q[2] || 5000);
const src = 'onmessage = (e) => {' +
  ' const { mb, period } = e.data; const a = new Float64Array(mb * 131072);' +
  ' for (let i = 0; i < a.length; i++) a[i] = i;' +
  ' postMessage({ ready: true });' +
  ' const sweep = () => { const t0 = performance.now(); let s = 0; for (let i = 0; i < a.length; i += 8) s += a[i];' +
  ' postMessage({ ms: performance.now() - t0, s }); setTimeout(sweep, period); };' +
  ' sweep(); };';
const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
const o = document.getElementById('o');
const say = (m) => { try { dump(m + '\n'); } catch (e) {} };
w.onmessage = (e) => {
  if (e.data.ready) { say('MEMREADY ' + id + ' ' + mb); o.textContent = 'tab ' + id + ': ' + mb + ' MB ready'; return; }
  say('MEMSWEEP ' + id + ' ' + e.data.ms.toFixed(0) + ' ' + mb);
  o.textContent = 'tab ' + id + ': ' + mb + ' MB, sweep ' + e.data.ms.toFixed(0) + ' ms';
};
w.postMessage({ mb, period });
</script>
