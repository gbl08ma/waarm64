<!doctype html>
<meta charset="utf-8">
<title>waarm64 boot profile</title>
<link rel="icon" href="data:,">
<script type="module">
  // A PC-sampled warm boot (bench/boot/profile.ts drives this page).
  const worker = new Worker(new URL('./profile-worker.ts', import.meta.url), { type: 'module' });
  worker.onmessage = (e) => { window.profile = e.data; };
  worker.onerror = (e) => { window.profile = { error: e.message }; };
</script>
