<!doctype html>
<meta charset="utf-8">
<title>scroll</title>
<style>
body { font: 16px/1.5 sans-serif; margin: 0; background: #f4f1ea; color: #222; }
main { max-width: 900px; margin: 0 auto; padding: 24px; }
article { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.15); margin: 0 0 24px; padding: 20px; overflow: hidden; }
h2 { margin: 0 0 8px; font-size: 22px; }
.band { height: 60px; border-radius: 8px; margin: 12px 0; }
img { float: right; margin: 0 0 8px 16px; border-radius: 50%; }
</style>
<script src="bench.js"></script>
<main id="m"></main>
<script>
// A long page of what WebRender draws: text, rounded and shadowed boxes, gradients, images; scrolled 6 px a frame.
const words = 'the quick brown fox jumps over a lazy dog while seven wizards box with zebras and jovial kings quietly mix gin'.split(' ');
const img = document.createElement('canvas');
img.width = img.height = 96;
const c = img.getContext('2d');
for (let i = 0; i < 6; i++) { c.fillStyle = `hsl(${i * 60},70%,55%)`; c.fillRect(i * 16, 0, 16, 96); }
const src = img.toDataURL();
let html = '';
for (let i = 0; i < 300; i++) {
  let text = '';
  for (let w = 0; w < 120; w++) text += words[(i * 7 + w * 13) % words.length] + ' ';
  html += `<article><h2>Section ${i + 1}</h2>${i % 3 ? '' : `<img src="${src}" width="96" height="96">`}<p>${text}</p>` +
    `<div class="band" style="background: linear-gradient(90deg, hsl(${i * 37 % 360},70%,60%), hsl(${(i * 37 + 120) % 360},70%,60%))"></div><p>${text}</p></article>`;
}
document.getElementById('m').innerHTML = html;
const still = location.search.includes('still');
addEventListener('load', () => ffbench(still ? 'still' : 'scroll', () => {
  if (still) return;
  if (scrollY + innerHeight >= document.documentElement.scrollHeight - 2) scrollTo(0, 0); else scrollBy(0, 6);
}));
</script>
