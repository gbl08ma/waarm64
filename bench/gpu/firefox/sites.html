<!doctype html>
<meta charset="utf-8">
<title>sites</title>
<pre id="o"></pre>
<script>
// Real sites in one tab, by bot (bench/gpu/firefox-load.ts PHASES=sites; opt-in and bench-only: the guest online
// through a tailcat exit node, docs/benchmarking.md "Screening an A/B"): this page opens each URL of `urls` (comma
// separated, encoded) in turn in one named tab (`window.open(url, 'site')`: the same tab navigated, the last page
// unloaded), `dwell` seconds each (20), the list `cycles` times (1). Lines on Firefox's stdout: `FFBENCH sites ready`,
// `FFBENCH site <n> <url> t=<ms>` at each visit (t since this page's start), `FFBENCH sites done t=<ms>`. In
// Chromium (GUEST_BROWSER=chromium) the same lines through its console log.
// The query, or all of it encoded in `q` (sway's exec runs the command through a shell, where a bare `&` ends it).
const q0 = new URLSearchParams(location.search), q = q0.has('q') ? new URLSearchParams(q0.get('q')) : q0;
const urls = (q.get('urls') ?? '').split(',').filter(Boolean), dwell = +(q.get('dwell') ?? 20), cycles = +(q.get('cycles') ?? 1);
const t0 = performance.now();
// Firefox's dump() writes stdout; Chromium has none: its console goes to stderr (`--enable-logging=stderr`).
const say = (s) => { if (typeof dump === 'function') dump(`FFBENCH ${s}\n`); else console.log(`FFBENCH ${s}`); document.getElementById('o').textContent += `${s}\n`; };
say('sites ready');
let n = 0;
const next = () => {
  if (n >= urls.length * cycles) { say(`sites done t=${Math.round(performance.now() - t0)}`); return; }
  const url = urls[n % urls.length];
  say(`site ${n} ${url} t=${Math.round(performance.now() - t0)}`);
  window.open(url, 'site');
  n++;
  setTimeout(next, dwell * 1000);
};
setTimeout(next, 1000);
</script>
