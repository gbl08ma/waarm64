// bench/gpu/firefox-load.ts, as /usr/lib/firefox/waarm64.cfg: with FFBENCH_SUPPORT=<file> in the environment, about:support's
// graphics section summarized into <file> 20 s after start (`key value` lines: the features' decisions, the failures).
try {
  const file = Services.env.get("FFBENCH_SUPPORT");
  if (file) {
    const { setTimeout } = ChromeUtils.importESModule("resource://gre/modules/Timer.sys.mjs");
    setTimeout(async () => {
      let out = "";
      try {
        const { Troubleshoot } = ChromeUtils.importESModule("resource://gre/modules/Troubleshoot.sys.mjs");
        const g = (await Troubleshoot.snapshot()).graphics;
        for (const [k, v] of Object.entries(g)) if (typeof v !== "object" && !/Extensions|WSIInfo/.test(k)) out += `${k} ${String(v).slice(0, 160)}\n`;
        for (const f of g.featureLog?.features ?? []) out += `feature ${f.name} ${f.status} ${(f.log ?? []).map((l) => `${l.type}:${l.status}:${l.message ?? ""}`).join(" | ").slice(0, 240)}\n`;
        for (const f of g.featureLog?.fallbacks ?? []) out += `fallback ${f.name} ${f.message}\n`;
        for (const f of g.failures ?? []) out += `failure ${f}\n`;
        for (const [k, v] of Object.entries(g.content ?? {})) out += `content ${k} ${JSON.stringify(v).slice(0, 160)}\n`;
      } catch (e) {
        out += `error ${e}\n`;
      }
      // No IOUtils here: an XPCOM file stream (the text is ASCII).
      const f = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
      f.initWithPath(file);
      const os = Components.classes["@mozilla.org/network/file-output-stream;1"].createInstance(Components.interfaces.nsIFileOutputStream);
      os.init(f, 0x02 | 0x08 | 0x20, 0o644, 0);
      os.write(out, out.length);
      os.close();
    }, 20000);
  }
} catch (e) {
  Components.utils.reportError(e);
}
