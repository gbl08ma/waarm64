[package]
name = "codecs"
version = "0.0.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
lz4_flex = { version = "0.14.2", default-features = false }
snap = "1.1.2"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
crc32fast = { version = "1.5", default-features = false }
zstd-safe = { version = "7", default-features = false, optional = true }

[features]
safe = ["lz4_flex/safe-encode", "lz4_flex/safe-decode"]
czstd = ["dep:zstd-safe"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
