<!doctype html>
<!-- The picture a link to the page shows where it is shared (web/app/index.html's og:image), and the page's icon as a
     PNG for what takes no SVG (`?icon`: a phone's home screen, the installed app's manifest), and the installed app's
     maskable icon (`?icon&maskable`: more room around it, so its steam stays in the circle a mask keeps, 40% of its
     width from the middle). Drawn with the panel's colors (web/app/theme/tokens.css, written out) and
     its typeface; tools/social-card.ts renders it to web/app/public/. -->
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face { font-family: Barlow; font-weight: 400; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-400-normal.woff2'); }
  @font-face { font-family: Barlow; font-weight: 500; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-500-normal.woff2'); }
  @font-face { font-family: Barlow; font-weight: 600; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2'); }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; display: flex; flex-direction: column; background: #141413; color: #e6e3db; font-family: Barlow, sans-serif; }
  .bar { display: flex; align-items: center; gap: 16px; height: 84px; padding: 0 56px; background: linear-gradient(#2c2c2a, #232321); border-bottom: 2px solid #0a0a09; font-size: 34px; font-weight: 600; }
  .bar span { color: #9b978c; }
  main { flex: 1; display: flex; align-items: center; gap: 48px; padding: 0 56px; }
  h1 { margin: 0 0 24px; font-size: 73px; line-height: 1.08; font-weight: 600; }
  p { margin: 0; font-size: 30px; line-height: 1.35; color: #9b978c; }
  .words { flex: 1; }
  .machine { flex: none; width: 420px; padding: 14px; background: #1e1e1c; border: 1px solid #0a0a09; border-radius: 4px; box-shadow: 0 8px 28px #000a, inset 0 1px 0 #ffffff12; }
  .screen { display: block; width: 100%; height: 250px; background: #000; }
  pre { margin: 14px 0 0; padding: 12px 14px; background: #0c0c0b; font: 19px/1.35 ui-monospace, 'DejaVu Sans Mono', monospace; color: #e6e3db; }
  /* The icon alone, filling the picture, at the viewport's size (180, 192, 512). */
  body.icon { width: 100vw; height: 100vh; display: block; }
  svg.icon { width: 100vw; height: 100vh; }
  body.icon > :not(.icon) { display: none; }
  body:not(.icon) > .icon { display: none; }
</style>
<svg class="icon" viewBox="-2 -2 20 20" width="180" height="180">
  <rect x="-4" y="-4" width="24" height="24" fill="#262624"/>
  <path shape-rendering="crispEdges" fill="#fa6432" d="M3 7h2v5h2V7h2v5h2V7h2v7H3z"/>
  <path fill="none" stroke="#6e6e67" stroke-width="1.1" stroke-linecap="round" d="M6 5.6C7.6 4 4.4 2.5 6 .9M10 5.6C8.4 4 11.6 2.5 10 .9"/>
</svg>
<div class="bar">
  <svg viewBox="0 0 16 16" width="48" height="48">
    <rect width="16" height="16" rx="2" fill="#141413"/>
    <path shape-rendering="crispEdges" fill="#fa6432" d="M3 7h2v5h2V7h2v5h2V7h2v7H3z"/>
    <path fill="none" stroke="#6e6e67" stroke-width="1.1" stroke-linecap="round" d="M6 5.6C7.6 4 4.4 2.5 6 .9M10 5.6C8.4 4 11.6 2.5 10 .9"/>
  </svg>
  <div><span>wa</span>arm64</div>
</div>
<main>
  <div class="words">
    <h1>A whole 64-bit ARM computer in a browser tab</h1>
    <p>Unmodified Linux, compiled to WebAssembly as it runs: a desktop, 3D, video, sound, USB.</p>
  </div>
  <div class="machine">
    <svg class="screen" viewBox="-210 -125 420 250"><path id="trace" fill="none" stroke="#fa6432" stroke-width="1.6"/></svg>
    <pre>~ # uname -srm
Linux 6.18.54 aarch64</pre>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('icon')) document.body.className = 'icon';
  if (q.has('maskable')) document.querySelector('svg.icon').setAttribute('viewBox', '-4 -4 24 24');
  // The screen's trace: an ellipse that turns as it is drawn, as the introduction's small program draws one.
  let d = '';
  for (let i = 0; i <= 1500; i++) {
    const t = (i / 1500) * 4 * 2 * Math.PI, turn = t * 0.11 + 0.3, x = 138 * Math.cos(t), y = 58 * Math.sin(t);
    d += `${i ? 'L' : 'M'}${(x * Math.cos(turn) - y * Math.sin(turn)).toFixed(1)} ${(x * Math.sin(turn) + y * Math.cos(turn)).toFixed(1)}`;
  }
  document.getElementById('trace').setAttribute('d', d);
</script>
</html>
